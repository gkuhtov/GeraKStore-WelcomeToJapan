name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build Tweak
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Upload Artifact (.dylib)
        uses: actions/upload-artifact@v4
        with:
          name: WelcomeToJapan-Dylib
          path: .theos/obj/debug/*.dylib
