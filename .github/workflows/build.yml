name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Install Theos Directly
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Install iOS SDKs
        run: |
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $THEOS/sdks
          cp -r sdks-master/* $THEOS/sdks/ || true
          rm -rf sdks-master sdks.zip

      - name: Build Tweak
        run: |
          make clean
          make FINALPACKAGE=1
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;
          find packages -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WelcomeToJapan-Build
          path: output/*
